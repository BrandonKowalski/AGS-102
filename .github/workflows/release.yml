# Build the RG SP release artifacts, and publish them when a version is tagged.
#
# The same steps run for pushes to main and for tags; only the final publish
# step is gated. A release therefore never takes a code path that has not
# already been exercised on every push leading up to it.
#
# There is no pull_request trigger because pull requests are disabled on this
# repository — the API returns 404 for them — so such a trigger could only ever
# be dead configuration. Add one here if that is ever turned on.
#
# arm64 runners are deliberate, not incidental. build-tools.sh and
# build-rootfs.sh pin --platform linux/arm64 to produce aarch64 binaries for the
# handheld, so on an x86 runner every one of those steps would run under
# QEMU-user emulation. Native arm64 runners are free on public repositories.
name: Build release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a branch build is fine; abandoning a half-finished release is not.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  TARGET: rgsp

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write # the publish step creates a release; nothing else writes

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # build-rootfs.sh and build-update.sh bake `git describe` into
          # /etc/baseos-release and into the update payload's metadata. A shallow
          # clone has no tags to describe against and silently stamps "unknown".
          fetch-depth: 0

      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(tr -d ' \n' < VERSION)"
          tag="${GITHUB_REF#refs/tags/}"
          # Artifact filenames come from VERSION, never from the tag, so without
          # this a v1.2.0 tag would happily publish files named 1.1.0.
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match VERSION ($version) — expected v$version" >&2
            exit 1
          fi
          echo "tag $tag matches VERSION $version"

      - name: Cache the prepared-input bundle
        uses: actions/cache@v4
        with:
          path: work/prepared
          # Keyed on the committed hash of the bundle itself, so a new bundle is
          # a new key. fetch-prepared.sh still verifies the SHA-256 before
          # unpacking, which means a corrupted cache entry fails the build rather
          # than poisoning it.
          key: prepared-${{ hashFiles('manifest/prepared/bundle.sha256') }}

      - name: Compute the shared-tools cache key
        id: toolskey
        # tools-stamp.sh covers the in-repo sources compiled into work/tools, but
        # not the pinned busybox/dropbear/curl versions — those live in
        # build-tools.sh, so both have to be in the key.
        run: echo "stamp=$(./tools/tools-stamp.sh | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache the shared aarch64 tools
        uses: actions/cache@v4
        with:
          path: work/tools
          key: tools-${{ hashFiles('build-tools.sh') }}-${{ steps.toolskey.outputs.stamp }}
          # build-all.sh compares work/tools/.stamp against tools-stamp.sh and
          # rebuilds on any mismatch, so a stale key costs time, never correctness.

      - name: Restore the prepared inputs
        run: ./fetch-prepared.sh "$TARGET"

      - name: Build the release artifacts
        # rootfs -> QEMU userspace smoke test -> image -> update payload. The
        # smoke test is part of this chain, so a rootfs that cannot reach init
        # can never become a release.
        run: ./build-all.sh "$TARGET"

      - name: Write SHA256SUMS
        id: artifacts
        run: |
          version="$(tr -d ' \n' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cd "work/$TARGET"
          # Hashes of the published files, checkable with sha256sum against the
          # download. This is not the image-sha256 the update engine verifies on
          # the device — that one covers the slot image inside the payload.
          sha256sum \
            "baseos-$TARGET-$version.img.zip" \
            "baseos-$TARGET-$version.bosupd" \
            | tee SHA256SUMS

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baseos-${{ env.TARGET }}-${{ steps.artifacts.outputs.version }}
          path: |
            work/${{ env.TARGET }}/baseos-${{ env.TARGET }}-${{ steps.artifacts.outputs.version }}.img.zip
            work/${{ env.TARGET }}/baseos-${{ env.TARGET }}-${{ steps.artifacts.outputs.version }}.bosupd
            work/${{ env.TARGET }}/SHA256SUMS
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.artifacts.outputs.version }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "BaseOS $VERSION" \
            --generate-notes \
            "work/$TARGET/baseos-$TARGET-$VERSION.img.zip" \
            "work/$TARGET/baseos-$TARGET-$VERSION.bosupd" \
            "work/$TARGET/SHA256SUMS"